<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detection Application</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Emotion Detection Application</h1>
      <p class="subtitle">IBM Skills Network — Final Project</p>
    </header>

    <section class="card">
      <label for="textToAnalyze" class="label">Please enter the text you wish to analyze below:</label>
      <textarea
        id="textToAnalyze"
        class="textarea"
        rows="4"
        placeholder="e.g. I am glad this happened"
      ></textarea>

      <button id="analyseBtn" class="btn" onclick="RunSentimentAnalysis()">
        Run Sentiment Analysis
      </button>
    </section>

    <section class="card result-card" id="resultCard">
      <h2>System Response</h2>
      <div id="system_response" class="narrative"></div>
    </section>

    <footer class="footer">
      IBM Skills Network &mdash; Final Project &mdash; Emotion Detector
    </footer>
  </div>
</body>
</html>
